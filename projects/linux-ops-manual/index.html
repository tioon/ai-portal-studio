<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Rocky Linux 9.6 · Ubuntu 22.04 공식 패키지의 man 페이지 전체를 담은 운영 명령어 레퍼런스. 모든 옵션, 배포판 차이, 한국어 운영 노트." />
  <title>Linux Ops Manual — 운영 레퍼런스</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">L/</span>Linux Ops Manual</a>
    <nav class="topnav" aria-label="주요 메뉴">
      <a href="#/" data-nav="home">운영 카드</a>
      <a href="#/all" data-nav="all">전체 명령어</a>
      <a href="#/x" data-nav="x">명령줄 해설</a>
      <a href="#/about" data-nav="about">데이터 출처</a>
    </nav>
    <div class="distro-tabs" role="group" aria-label="배포판 선택">
      <button class="tab" data-distro="r" aria-pressed="false">Rocky 9.6</button>
      <button class="tab" data-distro="u" aria-pressed="false">Ubuntu 22.04</button>
    </div>
    <a class="portal-link" href="../portal-home/">프로젝트 목록 ↗</a>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-label="탐색">
      <details class="navigation" open>
        <summary>목차 <span>분야 · 색인</span></summary>
        <nav id="sideNav" class="category-row" aria-label="분야"></nav>
      </details>
      <div class="sidebar-note" id="sideNote"></div>
    </aside>
    <main id="main" class="main-content" tabindex="-1">
      <section class="search-toolbar" aria-label="검색">
        <label class="search" for="searchInput"><span class="sr-only">명령어 검색</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="searchInput" type="search" placeholder="명령어 이름 또는 작업 검색 — 예: rsync, 디스크, firewall" autocomplete="off" spellcheck="false" />
          <kbd aria-hidden="true">/</kbd>
        </label>
      </section>
      <div id="view" class="view" aria-live="polite"><p class="loading">데이터를 불러오는 중…</p></div>
      <footer class="footer" id="footer"></footer>
    </main>
  </div>
  <div id="copyStatus" class="sr-only" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
